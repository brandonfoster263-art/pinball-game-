<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Rift Pinball</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303020a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%236dfcff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff2ad1'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="hud-row">
        <div class="hud-block">
          <span class="hud-label">Score</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Balls</span>
          <span id="balls" class="hud-value">●●●</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Multiplier</span>
          <span id="multiplier" class="hud-value">x1</span>
        </div>
      </div>
      <div class="hud-row">
        <div id="nodes" class="hud-block nodes-block">
          <span class="hud-label">Data Nodes</span>
          <span id="nodes-pips" class="hud-value">○○○○○</span>
        </div>
        <div id="status-flags" class="hud-block status-block"></div>
      </div>
    </div>

    <div id="banner"></div>
    <div id="hint"></div>

    <div id="overlay">
      <div id="overlay-panel">
        <h1>NEON RIFT PINBALL</h1>
        <p class="sub">cyberspace flipper deck</p>
        <p id="overlay-msg">Press SPACE / tap LAUNCH to drop the ball</p>
        <div id="controls-help">
          <div><kbd>Z</kbd> / <kbd>←</kbd> Left flipper</div>
          <div><kbd>/</kbd> / <kbd>→</kbd> Right flipper</div>
          <div><kbd>X</kbd> Mid flipper</div>
          <div><kbd>Space</kbd> Plunger / Launch</div>
          <div><kbd>P</kbd> Pause</div>
        </div>
        <button id="start-btn">START</button>
      </div>
    </div>

    <div id="touch-controls">
      <button id="t-left" class="t-btn">◁</button>
      <button id="t-launch" class="t-btn t-launch">LAUNCH</button>
      <button id="t-right" class="t-btn">▷</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
